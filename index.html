<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unità d'Italia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="classic">
<header>
  <div class="header-inner">
    <h1>Unità d'Italia</h1>

    <div class="themes" aria-label="Temi">
      <span class="themes-label">Tema:</span>
      <button type="button" class="theme-btn" data-theme="classic">Classico</button>
      <button type="button" class="theme-btn" data-theme="dark">Scuro</button>
      <button type="button" class="theme-btn" data-theme="elegant">Elegante</button>
      <button type="button" class="theme-btn" data-theme="sepia">Seppia</button>
      <button type="button" class="theme-btn" data-theme="lim">LIM</button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <img src="assets/img/copertina.png" alt="Copertina Unità d'Italia" class="zoomable">
    <div class="hero-actions">
      <button type="button" class="primary" data-open-pdf="assets/Unita_d_Italia.pdf">📖 Apri lezione (PDF)</button>
      <button type="button" class="primary" data-open-pdf="assets/Unita-schemi.pdf">🖥️ Apri schemi LIM (PDF)</button>
    </div>
  </section>

  <section class="downloads">
    <h2>Materiali</h2>
    <div class="links">
      <a href="assets/Unita_d_Italia.pdf" download>⬇️ Scarica lezione (PDF)</a>
      <a href="assets/Unita-schemi.pdf" download>⬇️ Scarica schemi (PDF)</a>
      <a href="assets/Unita_schemi.pptx" download>⬇️ Scarica schemi (PPTX)</a>
    </div>
  </section>

  <section class="viewer">
    <h2>Lettura rapida</h2>
    <p>Puoi leggere i PDF direttamente in pagina oppure aprirli a schermo intero con i pulsanti sopra.</p>
    <div class="inline-viewers">
      <div class="inline-card">
        <div class="inline-head">
          <strong>Lezione (PDF)</strong>
          <button type="button" class="smallbtn" data-open-pdf="assets/Unita_d_Italia.pdf">Apri a schermo intero</button>
        </div>
        <iframe src="assets/Unita_d_Italia.pdf" title="Lezione Unità d'Italia (PDF)"></iframe>
      </div>

      <div class="inline-card">
        <div class="inline-head">
          <strong>Schemi (PDF)</strong>
          <button type="button" class="smallbtn" data-open-pdf="assets/Unita-schemi.pdf">Apri a schermo intero</button>
        </div>
        <iframe src="assets/Unita-schemi.pdf" title="Schemi Unità d'Italia (PDF)"></iframe>
      </div>
    </div>
  </section>
</main>

<!-- MODALE: PDF + IMMAGINI -->
<div id="modal" class="modal hidden" aria-hidden="true">
  <div class="modal-overlay" data-close="true"></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-label="Visualizzatore">
    <button type="button" class="modal-close" data-close="true">✖ Chiudi</button>
    <iframe id="modalFrame" class="modal-frame hidden" title="PDF"></iframe>
    <img id="modalImage" class="modal-image hidden" alt="Immagine" />
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
